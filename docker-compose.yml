services:
  api:
    build: .
    image: medico-extractor:latest
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      PORT: 8000
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # Starlette spools large multipart uploads to a temp file.
      - /tmp:size=64m
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
