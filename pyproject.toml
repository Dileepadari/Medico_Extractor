[project]
name = "medico-extractor"
version = "1.0.0"
description = "Structured data extraction from medical referral documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dileep Adari" }]

# Keep in sync with requirements.txt, which is what the Docker build installs.
# Vercel resolves dependencies from this file in preference to requirements.txt:
# if this list is missing or stale, the deployed function starts with those
# packages absent and crashes on import.
dependencies = [
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "python-multipart==0.0.22",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "langchain-core==1.2.22",
    "langchain-google-genai==4.2.1",
    "python-dotenv==1.2.2",
    "tenacity==9.1.4",
]

[tool.setuptools]
packages = ["app"]

# The ASGI app Vercel loads. Stated explicitly because `app/main.py` and the old
# `api/index.py` were both auto-detectable entrypoints, and the choice between
# them was left to the platform.
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # FastAPI dependencies are function calls in defaults by design
    "E501",  # long lines are caught by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
